[pytest]
DJANGO_SETTINGS_MODULE = docuweaver.test_settings
pythonpath = .
python_files = tests.py test_*.py
testpaths = drawings
env =
    D:DJANGO_SECRET_KEY=test-only-secret-key-not-for-production
    D:DJANGO_DEBUG=false
    D:DOCUWEAVER_REQUIRE_LOGIN=true
filterwarnings =
    error::DeprecationWarning:django
    error::DeprecationWarning:rest_framework
