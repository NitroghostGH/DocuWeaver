name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_DEBUG: "false"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Django system checks
        run: python manage.py check

      - name: Run tests
        run: pytest

  browser:
    # The editor in headless Chromium against `manage.py serve` (DEBUG off,
    # sign-in on), with a drawing whose asset positions are known.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-browser.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps --only-shell chromium

      - name: Run browser tests
        run: pytest browser_tests

      - name: Upload screenshots and server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-artifacts
          path: browser-test-artifacts/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t docuweaver:ci .
      - name: Smoke test
        run: |
          docker run -d --name dw -p 8000:8000 -e DJANGO_SECRET_KEY=ci-only-secret-key docuweaver:ci
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8000/accounts/login/; then echo "OK"; exit 0; fi
            sleep 1
          done
          docker logs dw; exit 1
